<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegisverse Sandbox</title>
    <style>
      :root {
        --bg: #12161b;
        --panel: #1b222a;
        --line: #2b353f;
        --text: #d3d9df;
        --muted: #99a3af;
        --focus: #93a2b2;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
      #app { display:grid; grid-template-columns: 320px 1fr 340px; grid-template-rows: 80px 1fr 120px; height:100vh; gap: 4px; padding: 4px; }
      .panel { background: var(--panel); border: 1px solid var(--line); overflow:auto; padding:10px; }
      #top { grid-column: 1 / 4; display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
      #left { grid-column:1; grid-row:2; }
      #view { grid-column:2; grid-row:2; position:relative; border: 1px solid var(--line); }
      #right { grid-column:3; grid-row:2; }
      #bottom { grid-column:1 / 4; grid-row:3; display:flex; gap:12px; align-items:center; }
      button, select, input { background:#202a33; color:var(--text); border:1px solid #3c4957; padding:6px 8px; border-radius: 3px; }
      button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
      .hud { position:absolute; left:12px; top:10px; background:#10161bcf; border:1px solid #36414b; padding:8px; font-size:12px; }
      .warning { position:absolute; right:12px; top:10px; background:#3b2727ea; border:1px solid #7e4646; padding:8px; font-size:12px; max-width: 320px; }
      .list { display:grid; gap:4px; max-height: 40vh; overflow: auto; }
      .label { color:var(--muted); font-size:12px; }
      .help { white-space: pre-line; font-size: 12px; color: var(--muted); line-height: 1.4; }
      .grid-tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
      canvas { display:block; width:100%; height:100%; }
      pre { background: #121920; border: 1px solid #2e3944; padding: 8px; font-size: 12px; }
      @media (max-width: 1300px) {
        #app { grid-template-columns: 280px 1fr; grid-template-rows: 120px 1fr 240px 120px; }
        #right { grid-column: 1 / 3; grid-row: 3; }
        #bottom { grid-column: 1 / 3; grid-row: 4; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
